{% extends "base_template.html" %}

{% block document_title %}Пользователь - Арктический центр{% endblock %}

{% block form_title %}Добавление пользователя{% endblock %}

{% block main %}
    <div class="container">
        <div class="form-container">
            <div class="toolbar">
                <h2>Пользователь</h2>
            </div>

            <form method="post" id="create-form">
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" placeholder="user123" required maxlength="30" minlength="6" name="username">
                    <label>Пароль</label>
                    <input type="text" required maxlength="72" minlength="6" name="plainPassword">
                </div>

                <div class="form-group">
                    <label>Роль</label>
                    <select required name="role">
                        <option value="">-- Выберите роль --</option>
                        {% for role in roles %}
                            <option value="{{ role }}">{{ role }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-save">Сохранить</button>
                    <a href="/site/users" class="btn btn-back">Отмена</a>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="{{ url_for('static', path='JS/create_user.js') }}"></script>
{% endblock %}
