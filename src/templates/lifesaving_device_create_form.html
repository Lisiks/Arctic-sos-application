{% extends "base_template.html" %}

{% block document_title %}Форма спасательного средства{% endblock %}

{% block form_title %}Добавление спасательного средства{% endblock %}

{% block main %}
    <div class="container">
        <div class="form-container">
            <div class="toolbar">
                <h2>Спасательное средство</h2>
            </div>

            <form method="post" id="create-form">
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" placeholder="Например: Арктика" required name="name" maxlength="200", minlength="5">
                </div>

                <div class="form-group">
                    <label>Тип</label>
                    <select required name="type">
                        <option value="">-- Выберите тип --</option>
                        {% for type_ in lifesaving_devises_types %}
                            <option value="{{ type_ }}">{{ type_ }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Широта базирования °</label>
                    <input type="number" placeholder="0" min="-180" max="180" step="0.0001" name="latitude" required>
                    <label>Долгота базирования °</label>
                    <input type="number" placeholder="0" min="-180" max="180" step="0.0001" name="longitude" required>
                </div>

                <div class="form-group">
                    <label>Зона досягаемости (км)</label>
                    <input type="number" min="0" placeholder="0" required name="reachZoneKm"> 
                </div>

                <div class="form-group">
                    <label>Текущий статус</label>
                    <select required name="status">
                        <option value="">-- Выберите статус --</option>
                        {% for status in lifesaving_devises_statuses %}
                            <option value="{{ status }}">{{ status }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-save">Сохранить</button>
                    <a href="/site/lifesavingdevises" class="btn btn-back">Отмена</a>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="{{ url_for('static', path='JS/create_lifesaving_device.js') }}"></script>
{% endblock %}
