{% extends "base_template.html" %}

{% block document_title %}Сотрудник - Арктический центр{% endblock %}

{% block form_title %}Изменение сотрудника{% endblock %}

{% block main %}
    <div class="container">
        <div class="form-container">
            <div class="toolbar">
                <h2>Сотрудник</h2>
            </div>

            <form method="post" id="update-form">
                <div class="form-group">
                    <label>Фамилия</label>
                    <input type="text" placeholder="Иванов" required maxlength="100" minlength="2" name="f" value="{{ crew.f }}">
                    <label>Имя</label>
                    <input type="text" placeholder="Иван" required maxlength="100" minlength="2" name="i" value="{{ crew.i }}">
                    <label>Отчество</label>
                    <input type="text" placeholder="Иванович" required maxlength="100" minlength="2" name="o" value="{{ crew.o }}">
                </div>

                <div class="form-group">
                    <label>Должность</label>
                    <select required name="position">
                        <option value="">-- Выберите должность --</option>
                        {% for position in positions %}
                            {% if position == crew.position.value %}
                                <option value="{{ position }}" selected>{{ position }}</option>
                            {% else %}
                                <option value="{{ position }}">{{ position }}</option>
                            {% endif %}
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Спасательное средство</label>
            
                    <select required name="lifesavingDevicesId">
                        <option value="">-- Выберите средство --</option>
                        {% for lifesaving_device in livesaving_devises %}
                            {% if lifesaving_device.id == crew.lifesaving_devices_id %}
                                <option value="{{ lifesaving_device.id }}" selected>{{ lifesaving_device.name }}</option>
                            {% else %}
                                <option value="{{ lifesaving_device.id }}">{{ lifesaving_device.name }}</option>
                            {% endif %}
                        {% endfor %}
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-save">Сохранить</button>
                    <a href="/site/crews" class="btn btn-back">Отмена</a>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="{{ url_for('static', path='JS/update_crew.js') }}"></script>
{% endblock %}
