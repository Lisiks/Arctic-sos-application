<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Спасательное средство - Арктический центр</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Координационный центр арктических поисково-спасательных операций</h1>
        <p>Форма спасательного средства</p>
    </header>

    <div class="nav-tabs">
        <a href="index.html">Поступившие сообщения</a>
        <a href="plan.html">План реагирования</a>
        <a href="act.html">Итоговый акт операции</a>
        <a href="false_alarms.html">Ложные срабатывания</a>
        <a href="rescue_means.html" class="active">Спасательные средства</a>
        <a href="crew.html">Экипаж</a>
        <a href="reports.html">Отчетность</a>
    </div>

    <div class="container">
        <div class="form-container">
            <div class="toolbar">
                <h2>Спасательное средство</h2>
            </div>

            <form>
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" placeholder="Например: Арктика" required>
                </div>

                <div class="form-group">
                    <label>Тип</label>
                    <select required>
                        <option value="">-- Выберите тип --</option>
                        <option>Судно</option>
                        <option>Буксир</option>
                        <option>Катер</option>
                        <option>СВП</option>
                        <option>Вертолет</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Координаты базирования</label>
                    <input type="text" placeholder="Например: 75°N, 45°E">
                </div>

                <div class="form-group">
                    <label>Зона досягаемости (км)</label>
                    <input type="number" min="0" placeholder="0" required>
                </div>

                <div class="form-group">
                    <label>Текущий статус</label>
                    <select required>
                        <option value="">-- Выберите статус --</option>
                        <option>Готов</option>
                        <option>В рейде</option>
                        <option>На обслуживании</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-save">Сохранить</button>
                    <a href="rescue_means.html" class="btn btn-back">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
