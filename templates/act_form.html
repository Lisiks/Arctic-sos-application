<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Итоговый акт операции - Арктический центр</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Координационный центр арктических поисково-спасательных операций</h1>
        <p>Оформление итогового акта операции</p>
    </header>

    <div class="nav-tabs">
        <a href="index.html" class="active">Поступившие сообщения</a>
        <a href="plan.html">План реагирования</a>
        <a href="act.html">Итоговый акт операции</a>
        <a href="false_alarms.html">Ложные срабатывания</a>
        <a href="rescue_means.html">Спасательные средства</a>
        <a href="crew.html">Экипаж</a>
        <a href="reports.html">Отчетность</a>
    </div>

    <div class="container">
        <div class="form-container">
            <div class="toolbar">
                <h2>Итоговый акт по сообщению #102</h2>
            </div>

            <form>
                <div class="form-group">
                    <label>Количество спасенных</label>
                    <input type="number" min="0" placeholder="0" required>
                </div>

                <div class="form-group">
                    <label>Оказанная помощь</label>
                    <textarea placeholder="Описание оказанной помощи"></textarea>
                </div>

                <div class="form-group">
                    <label>Затраченные ресурсы</label>
                    <textarea placeholder="Топливо, личный состав, техника и т.д."></textarea>
                </div>

                <div class="form-group">
                    <label>Дата прибытия</label>
                    <input type="datetime-local" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-save">Сохранить</button>
                    <a href="index.html" class="btn btn-back">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
